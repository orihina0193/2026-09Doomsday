<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>スプレッドシート データ一覧</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .table-container::-webkit-scrollbar {
      height: 6px;
    }
    .table-container::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    .table-container::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    button, a {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen font-sans antialiased selection:bg-emerald-100 selection:text-emerald-900">

  <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6">

    <!-- ヘッダー -->
    <header class="mb-4 flex items-center justify-between gap-3 border-b border-slate-200 pb-3 sm:pb-4">
      <div class="min-w-0">
        <h1 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight flex items-center gap-2 truncate">
          <span class="inline-block w-2 sm:w-2.5 h-5 sm:h-6 bg-emerald-600 rounded-xs shrink-0"></span>
          スプレッドシート データ一覧
        </h1>
        <p class="text-xs text-slate-500 mt-0.5 hidden xs:block">
          座標タップで簡単コピー &bull; リアルタイム連携
        </p>
      </div>

      <button
        id="refreshBtn"
        onclick="fetchSheetData()"
        class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white hover:bg-slate-50 text-slate-700 text-xs font-medium rounded-lg border border-slate-200 shadow-2xs transition-colors active:scale-95 shrink-0 min-h-[38px]"
        title="最新データを再取得"
      >
        <svg id="refreshIcon" class="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
        <span>更新</span>
      </button>
    </header>

    <!-- 検索・コントロール -->
    <div class="mb-3 sm:mb-4 bg-white p-3 rounded-2xl border border-slate-200 shadow-xs space-y-2.5">

      <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5">

        <!-- 検索 -->
        <div class="relative flex-1">
          <input
            type="text"
            id="searchInput"
            oninput="onSearchInput()"
            placeholder="表全体を検索..."
            class="w-full pl-9 pr-8 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all text-slate-800"
          />

          <svg class="w-4 h-4 text-slate-400 absolute left-3 top-2.5 pointer-events-none"
            fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>

          <button
            id="clearSearchBtn"
            onclick="clearSearch()"
            class="hidden absolute right-2.5 top-2 text-slate-400 hover:text-slate-600 p-0.5"
          >
            ✕
          </button>
        </div>

      </div>

      <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-100 text-xs">

        <div class="flex flex-wrap items-center gap-2">

          <!-- ペア連携モード -->
          <button
            id="togglePairedModeBtn"
            onclick="togglePairedMode()"
            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-xs bg-emerald-50 text-emerald-900 border-emerald-300 font-semibold shadow-2xs select-none cursor-pointer"
            title="B列+D列 / F列+G列 ペアコピー連携モード"
          >
            <span id="pairedModeText">✓ B列+D列 / F列+G列 ペア連携中</span>
          </button>

          <!-- サーバー番号除外 -->
          <button
            id="toggleExcludeServerBtn"
            onclick="toggleExcludeServer()"
            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-xs bg-amber-50 text-amber-900 border-amber-300 font-semibold shadow-2xs select-none cursor-pointer"
            title="サーバー番号(S:511等)を除外するかどうか切り替え"
          >
            <span id="excludeServerText">✓ サーバー番号を除外</span>
          </button>

          <!-- 座標列表示切替 -->
          <button
            id="toggleCoordColumnBtn"
            onclick="toggleHideCoordColumn()"
            class="hidden inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-xs bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100 transition-colors select-none cursor-pointer"
            title="表示切替"
          >
            <span id="toggleCoordIcon">👁️</span>
            <span id="toggleCoordText">座標列表示切替</span>
          </button>

          <!-- 名前列選択 -->
          <div id="nameColContainer" class="hidden inline-flex items-center gap-1.5 text-slate-600">
            <span class="hidden sm:inline font-medium">名前列:</span>
            <select
              id="nameColSelect"
              onchange="onNameColChange(this.value)"
              class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-slate-800 focus:outline-none focus:ring-1 focus:ring-emerald-500 font-medium cursor-pointer text-xs"
              title="タップしてコピーする名前の列"
            >
              <option value="">自動判定中...</option>
            </select>
          </div>

          <!-- 同盟列選択 -->
          <div id="allianceColContainer" class="hidden inline-flex items-center gap-1.5 text-slate-600">
            <span class="hidden sm:inline font-medium">同盟列(B列):</span>
            <select
              id="allianceColSelect"
              onchange="onAllianceColChange(this.value)"
              class="bg-slate-50 border border-slate-200 rounded-lg px-2 py-1 text-slate-800 focus:outline-none focus:ring-1 focus:ring-emerald-500 font-medium cursor-pointer text-xs"
              title="通常座標コピー時に付与する同盟名の列"
            >
              <option value="">自動判定中...</option>
            </select>
          </div>

          <!-- プレイヤー名にも同盟付与 -->
          <button
            id="toggleIncludeAllianceBtn"
            onclick="toggleIncludeAlliance()"
            class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg border text-xs bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100 transition-colors select-none cursor-pointer"
            title="プレイヤー名コピー時にも同盟名を付与するか切り替え"
          >
            <span id="includeAllianceText">同盟名(B列)を連携中</span>
          </button>

        </div>

        <div class="flex items-center gap-2 ml-auto">

          <span id="recordCount"
            class="font-medium text-slate-700 bg-slate-100 px-2.5 py-1 rounded-lg">
            0 件
          </span>

          <!-- 表 / カード -->
          <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-200">

            <button
              id="viewModeTableBtn"
              onclick="setViewMode('table')"
              class="px-2.5 py-1 rounded-md text-xs font-semibold bg-white text-emerald-700 shadow-2xs transition-colors"
            >
              表
            </button>

            <button
              id="viewModeCardsBtn"
              onclick="setViewMode('cards')"
              class="px-2.5 py-1 rounded-md text-xs font-medium text-slate-600 hover:text-slate-900 transition-colors"
            >
              カード
            </button>

          </div>
        </div>
      </div>

      <!-- ソート状態 -->
      <div id="sortStatusContainer"
        class="hidden flex items-center gap-2 pt-1 border-t border-slate-100 text-xs">

        <span class="text-slate-500">並べ替え:</span>

        <div class="inline-flex items-center gap-1.5 bg-emerald-50 text-emerald-800 px-2 py-0.5 rounded-md border border-emerald-200 font-medium">
          <span id="sortStatusText"></span>
          <button onclick="resetSort()" class="hover:text-emerald-950 font-bold p-0.5" title="解除">
            ✕
          </button>
        </div>
      </div>

    </div>

    <!-- ステータス -->
    <div id="statusMessage" class="hidden mb-3 p-3 rounded-xl text-xs sm:text-sm border"></div>

    <!-- テーブル -->
    <div id="tableViewContainer"
      class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">

      <div class="table-container overflow-x-auto">

        <table class="min-w-full divide-y divide-slate-200 text-xs sm:text-sm text-left">

          <thead id="tableHead" class="bg-slate-50 text-slate-700 select-none"></thead>

          <tbody id="tableBody" class="divide-y divide-slate-100 bg-white">
            <tr>
              <td colspan="10" class="py-12 text-center text-slate-400">
                データを読み込んでいます...
              </td>
            </tr>
          </tbody>

        </table>

      </div>
    </div>

    <!-- カード -->
    <div id="cardsViewContainer" class="hidden space-y-2.5"></div>

    <!-- フッター -->
    <footer class="mt-4 flex flex-col sm:flex-row items-center justify-between text-xs text-slate-400 gap-1.5 px-1">
      <p>
        💡 📍ピンが付いた「名前」のボタンをタップすると、【名前＋座標】がクリップボードにコピーされます。
      </p>
      <p class="hidden sm:inline">
        列の見出しタップで「昇順 / 降順」に並べ替え
      </p>
    </footer>

  </div>

  <!-- コピー通知 -->
  <div id="copyToast"
    class="hidden fixed bottom-4 inset-x-3 sm:inset-x-auto sm:right-6 sm:bottom-6 z-50 flex items-center justify-center pointer-events-none">

    <div class="w-full sm:w-auto flex items-center gap-2 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl text-xs sm:text-sm font-medium border border-slate-700 pointer-events-auto">

      <span class="w-5 h-5 rounded-full bg-emerald-500 text-white flex items-center justify-center shrink-0 text-xs font-bold">
        ✓
      </span>

      <div class="truncate flex-1">
        <span class="text-emerald-400 font-semibold">名前＋座標をコピー:</span>
        <span id="copyToastText"
          class="font-mono bg-slate-800 px-2 py-0.5 rounded border border-slate-700 ml-1"></span>
      </div>

    </div>
  </div>

<script>

const SHEET_CSV_URL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vRnJkX_QsjmxeZMsepepY1VR7eB9eSwaPhnA35iN6rwFxyqDebC_k-ABZZB8VxKM4J9mQGty7phZdEu/pub?output=csv";

let rawHeaders = [];
let rawRows = [];

let currentSort = {
  colIndex: null,
  direction: null
};

let currentViewMode = 'table';
let hideCoordColumn = false;
let selectedNameColIndex = null;
let selectedAllianceColIndex = null;
let includeAllianceWithPlayer = false;
let excludeServer = true;

let pairedMode = true;

let pair1NameCol = 1;
let pair1CoordCol = 3;
let pair2NameCol = 5;
let pair2CoordCol = 6;

let toastTimeout = null;


/* =========================================================
   ペアコピー
========================================================= */

function getPairedCopyInfo(nameVal, coordVal, excludeSrv = true) {

  const name = (nameVal || '').trim();

  let coord = (coordVal || '').trim();

  if (excludeSrv && coord) {
    coord = stripServerFromCoord(coord);
  }

  let copyText = '';

  if (name && coord) {
    copyText = name + ' ' + coord;
  } else if (name) {
    copyText = name;
  } else if (coord) {
    copyText = coord;
  }

  return {
    displayName: name || coord,
    copyText: copyText,
    hasContent: Boolean(copyText)
  };
}


/* =========================================================
   同盟列判定
========================================================= */

function findAllianceColumnIndex(headers) {

  if (!headers || headers.length === 0) return -1;

  const allianceKeywords = [
    '同盟',
    '同盟名',
    '同盟略称',
    'ギルド',
    'guild',
    'alliance',
    'clan',
    '連盟',
    'チーム',
    '勢力',
    '軍団',
    'タグ',
    'tag'
  ];

  for (let i = 0; i < headers.length; i++) {

    const h = (headers[i] || '').toLowerCase().trim();

    if (allianceKeywords.some(kw => h.includes(kw))) {
      return i;
    }
  }

  if (headers.length > 1) {

    const h1 = (headers[1] || '').toLowerCase().trim();

    if (
      !h1.includes('座標') &&
      !h1.includes('coord') &&
      !h1.includes('サーバー') &&
      !h1.includes('server') &&
      !h1.includes('名前') &&
      !h1.includes('プレイヤー')
    ) {
      return 1;
    }
  }

  return -1;
}


function getEffectiveAllianceColIndex() {

  if (
    selectedAllianceColIndex !== null &&
    selectedAllianceColIndex >= 0 &&
    selectedAllianceColIndex < rawHeaders.length
  ) {
    return selectedAllianceColIndex;
  }

  return findAllianceColumnIndex(rawHeaders);
}


function getRowAlliance(row, headers, explicitCol = -1) {

  const colIdx =
    explicitCol >= 0
      ? explicitCol
      : getEffectiveAllianceColIndex();

  if (colIdx >= 0 && colIdx < row.length) {

    const val = (row[colIdx] || '').trim();

    if (
      val &&
      !isCoordinateCell(val, headers[colIdx] || '') &&
      !/^[SsKk]?:?\d+$/.test(val)
    ) {
      return val;
    }
  }

  if (colIdx !== 1 && row.length > 1) {

    const val = (row[1] || '').trim();

    if (
      val &&
      !isCoordinateCell(val, headers[1] || '') &&
      !/^[SsKk]?:?\d+$/.test(val)
    ) {
      return val;
    }
  }

  return '';
}


/* =========================================================
   サーバー番号除去
========================================================= */

function stripServerFromCoord(coord) {

  if (!coord) return '';

  return coord
    .replace(/^([SsKk#]|(?:鯖|サーバー):?)\s*\d+[\s,]+/i, '')
    .trim();
}


/* =========================================================
   名前列判定
========================================================= */

function findNameColumnIndex(headers, rows) {

  if (!headers || headers.length === 0) return 0;

  const nameKeywords = [
    '名前',
    'プレイヤー名',
    'プレイヤー',
    '城主',
    '君主',
    'ユーザー名',
    'ユーザー',
    'キャラ名',
    'キャラクター',
    'キャラ',
    '垢名',
    'ネーム',
    'ターゲット',
    '標的',
    'player',
    'user',
    'username',
    'name',
    'target',
    '拠点',
    '地点名',
    '地点',
    '名称'
  ];

  for (let i = 0; i < headers.length; i++) {

    const h = (headers[i] || '').toLowerCase().trim();

    if (nameKeywords.some(kw => h.includes(kw))) {
      return i;
    }
  }

  const negativeKeywords = [
    'サーバー',
    'server',
    's#',
    '鯖',
    '国',
    '王国',
    'realm',
    'king
